name: cpp-and-book-contract

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 1'

jobs:
  cpp:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
        build_type: [Debug, Release]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Select compiler
        run: |
          if [ "${{ matrix.compiler }}" = gcc ]; then
            echo "CC=gcc" >> "$GITHUB_ENV"
            echo "CXX=g++" >> "$GITHUB_ENV"
          else
            echo "CC=clang" >> "$GITHUB_ENV"
            echo "CXX=clang++" >> "$GITHUB_ENV"
          fi
      - name: Configure
        run: cmake -S . -B build/ci -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} -DBUILD_TESTING=ON
      - name: Build
        run: cmake --build build/ci -j 2
      - name: Test
        run: ctest --test-dir build/ci --output-on-failure

  sanitizers:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Configure Clang ASan and UBSan
        env:
          CC: clang
          CXX: clang++
        run: >-
          cmake -S . -B build/sanitized
          -DCMAKE_BUILD_TYPE=Debug
          -DBUILD_TESTING=ON
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
      - name: Build
        run: cmake --build build/sanitized -j 2
      - name: Test
        run: ctest --test-dir build/sanitized --output-on-failure

  thread-sanitizer:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Configure the positive SPSC path with TSan
        env:
          CC: gcc
          CXX: g++
        run: >-
          cmake -S capstones/order_book -B build/tsan
          -DCMAKE_BUILD_TYPE=Debug
          -DBUILD_TESTING=ON
          -DCMAKE_CXX_FLAGS="-fsanitize=thread -fno-omit-frame-pointer"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=thread"
      - name: Build the SPSC replay test
        run: cmake --build build/tsan --target capstone_spsc_replay_tests --parallel 2
      - name: Run the positive concurrent path
        run: ctest --test-dir build/tsan --output-on-failure -R capstone_spsc_replay_preserves_every_message

  windows-msvc:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        build_type: [Debug, Release]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Configure MSVC x64
        run: cmake -S . -B build/msvc -A x64 -DBUILD_TESTING=ON -DQUANT_BUILD_PYTHON=OFF
      - name: Build
        run: cmake --build build/msvc --config ${{ matrix.build_type }} --parallel 2
      - name: Test from the MSVC developer environment
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VSINSTALL=%%i"
          call "%VSINSTALL%\Common7\Tools\VsDevCmd.bat" -arch=x64
          ctest --test-dir build/msvc -C ${{ matrix.build_type }} --output-on-failure

  locked-python:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: '0.11.16'
          enable-cache: true
      - name: Restore locked Python environment
        run: uv sync --frozen --python 3.12
      - name: Locate Python and pybind11
        run: |
          echo "PYTHON_EXECUTABLE=$(uv run python -c 'import sys; print(sys.executable)')" >> "$GITHUB_ENV"
          echo "PYBIND11_DIR=$(uv run python -m pybind11 --cmakedir)" >> "$GITHUB_ENV"
      - name: Configure factor-kernel binding
        run: >-
          cmake -S capstones/factor_kernel -B build/factor-python
          -DBUILD_TESTING=ON
          -DPython3_EXECUTABLE="$PYTHON_EXECUTABLE"
          -Dpybind11_DIR="$PYBIND11_DIR"
      - name: Build and test factor-kernel binding
        run: |
          cmake --build build/factor-python --parallel 2
          ctest --test-dir build/factor-python --output-on-failure --no-tests=error -R capstone_factor_kernel_pybind_matches_arrow_numpy
      - name: Configure chapter 16 binding
        run: >-
          cmake -S code/ch16 -B build/ch16-python
          -DBUILD_TESTING=ON
          -DCH16_BUILD_PYTHON=ON
          -DPython3_EXECUTABLE="$PYTHON_EXECUTABLE"
          -Dpybind11_DIR="$PYBIND11_DIR"
      - name: Build and test chapter 16 binding
        run: |
          cmake --build build/ch16-python --parallel 2
          ctest --test-dir build/ch16-python --output-on-failure --no-tests=error -R ch16_optional_pybind_module_preserves_core_behavior

  optional-dependencies:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Configure Eigen and Catch2 branches
        run: >-
          cmake -S capstones/factor_kernel -B build/optional
          -DBUILD_TESTING=ON
          -DFACTOR_KERNEL_BUILD_PYTHON=OFF
          -DFACTOR_KERNEL_BUILD_EIGEN=ON
          -DFACTOR_KERNEL_BUILD_CATCH2=ON
      - name: Build and test optional dependencies
        run: |
          cmake --build build/optional --parallel 2
          ctest --test-dir build/optional --output-on-failure

  book:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install XeLaTeX, Biber, and PDF inspection tools
        run: |
          sudo apt-get update
          sudo apt-get install -y latexmk texlive-xetex texlive-lang-chinese texlive-latex-extra texlive-fonts-extra texlive-science biber poppler-utils
      - name: Build book
        run: |
          mkdir -p build/book/chapters build/book/appendices
          latexmk -xelatex -interaction=nonstopmode -halt-on-error -outdir=build/book main.tex
      - name: Check references, layout, and plausible PDF artifact with pdfinfo
        run: python tools/check_pdf_build.py --log build/book/main.log --pdf build/book/main.pdf --min-pages 200 --max-pages 280
      - name: Verify the version printed inside the book
        run: pdftotext build/book/main.pdf - | grep -F "版本：$(cat VERSION)"
      - name: Package this build for release
        run: python tools/package_release.py --source build/book/main.pdf --output-dir build/release
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: modern-cpp-for-quant-release
          path: build/release/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [book]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: modern-cpp-for-quant-release
          path: build/release
      - name: Verify tag and project version agree
        run: test "$GITHUB_REF_NAME" = "v$(cat VERSION)"
      - name: Publish the freshly built PDF and checksum
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" build/release/* --title "$GITHUB_REF_NAME" --generate-notes

  authoring-contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: python tools/check_book_contract.py
      - run: >-
          python -m unittest
          tools.tests.test_book_contract
          tools.tests.test_output_contract
          tools.tests.test_p2_editorial_contract
          tools.tests.test_ci_contract
          tools.tests.test_pdf_build_check
